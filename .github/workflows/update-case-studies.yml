name: Update case study library
on:
  push:
    paths:
      - "case-reports/**/*.pdf"
      - "Case*.pdf"
      - "scripts/build-case-studies.mjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/build-case-studies.mjs
      - name: Commit updated JSON
        run: |
          if git diff --quiet -- case-studies.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies.json
          git commit -m "Auto-update case study library"
          git push
