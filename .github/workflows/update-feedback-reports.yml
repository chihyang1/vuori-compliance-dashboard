name: Update Product Feedback report index
on:
  push:
    paths:
      - 'feedback-reports/**.pdf'
      - 'Product Feedback *.pdf'
      - 'generate-feedback-reports.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build report index
        run: python generate-feedback-reports.py
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedback-reports.json
          git diff --cached --quiet || git commit -m "Auto-update Product Feedback report index"
          git push
